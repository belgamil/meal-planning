<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meal Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>🍽️ Meal Planner</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="plan" role="tab">Plan</button>
      <button class="tab" data-view="recipes" role="tab">Recipes</button>
    </nav>
    <div class="header-actions">
      <button id="export-btn" class="ghost" title="Download a backup of your data">Export</button>
      <label class="ghost button-like" title="Restore from a backup file">
        Import<input id="import-input" type="file" accept="application/json" hidden />
      </label>
    </div>
  </header>

  <main>
    <!-- Weekly plan -->
    <section id="plan-view" class="view">
      <div class="week-toolbar">
        <button id="prev-week" class="ghost" aria-label="Previous week">←</button>
        <button id="today-btn" class="ghost">This week</button>
        <button id="next-week" class="ghost" aria-label="Next week">→</button>
        <h2 id="week-label"></h2>
        <button id="grocery-btn">🛒 Grocery list</button>
      </div>
      <div id="week-grid" class="week-grid"></div>
    </section>

    <!-- Recipe library -->
    <section id="recipes-view" class="view" hidden>
      <div class="recipes-toolbar">
        <input id="recipe-search" type="search" placeholder="Search recipes, ingredients, tags…" />
        <button id="new-recipe-btn">+ New recipe</button>
      </div>
      <div id="recipe-list" class="recipe-list"></div>
    </section>
  </main>

  <!-- Recipe editor -->
  <dialog id="recipe-dialog">
    <form id="recipe-form" method="dialog">
      <h2 id="recipe-dialog-title">New recipe</h2>
      <label>Name<input name="name" required /></label>
      <div class="row">
        <label>Servings<input name="servings" type="number" min="1" /></label>
        <label>Total time<input name="time" placeholder="e.g. 45 min" /></label>
      </div>
      <label>Link<input name="url" type="url" placeholder="https://…" /></label>
      <label>Tags<input name="tags" placeholder="comma separated, e.g. vegetarian, quick" /></label>
      <label>Ingredients <small>(one per line)</small><textarea name="ingredients" rows="6"></textarea></label>
      <label>Instructions<textarea name="instructions" rows="6"></textarea></label>
      <label>Notes<textarea name="notes" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button type="button" id="delete-recipe-btn" class="danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" data-close class="ghost">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Recipe viewer -->
  <dialog id="view-dialog">
    <div id="view-content"></div>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button type="button" id="view-edit-btn" class="ghost">Edit</button>
      <button type="button" data-close>Close</button>
    </div>
  </dialog>

  <!-- Add a recipe to a day -->
  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <h2 id="add-dialog-title">Add to day</h2>
      <label>Meal
        <select name="slot">
          <option>Breakfast</option>
          <option>Lunch</option>
          <option selected>Dinner</option>
          <option>Snack</option>
        </select>
      </label>
      <input id="add-search" type="search" placeholder="Search recipes…" />
      <div id="add-recipe-options" class="pick-list"></div>
      <p class="muted small">Or just type something you'll cook without a saved recipe:</p>
      <input name="freeText" placeholder="e.g. Leftovers, Takeout pizza" />
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" data-close class="ghost">Cancel</button>
        <button type="submit">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Grocery list -->
  <dialog id="grocery-dialog">
    <h2>🛒 Grocery list</h2>
    <p id="grocery-range" class="muted small"></p>
    <div id="grocery-content"></div>
    <div class="dialog-actions">
      <button type="button" id="copy-grocery-btn" class="ghost">Copy</button>
      <span class="spacer"></span>
      <button type="button" data-close>Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
